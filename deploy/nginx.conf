worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 允许上传最高 150MB 的 .glb 真 3D 模型
    client_max_body_size 160m;

    # 开启 Gzip 压缩，显著降低 80 人开考时的题库 JSON 与 JS/CSS 带宽占用
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml model/gltf-binary;

    upstream wmpses_api {
        server app:8765;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 禁止外部直接下载数据库与敏感文件
        location ~* (\.db|\.sql|\.py|\.git) {
            return 403;
        }

        # 静态资源开启强缓存与 ETag（80 人同时开考时大幅减轻服务器压力）
        location ~* \.(js|css|jpg|jpeg|png|webp|svg|gif|glb|woff2)$ {
            expires 24h;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # 入口 HTML 协商缓存，确保发版及时生效
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # 反向代理全部 REST API 至 FastAPI 多 Worker 集群
        location /api/ {
            proxy_pass http://wmpses_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
