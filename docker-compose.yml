version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: wmpses-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WMPSES_MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${WMPSES_MYSQL_DATABASE:-wmpses}
      MYSQL_USER: ${WMPSES_MYSQL_USER:-wmpses}
      MYSQL_PASSWORD: ${WMPSES_MYSQL_PASSWORD:-wmpses123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=300
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=256M
    ports:
      - "${WMPSES_MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - wmpses_mysql_data:/var/lib/mysql
      - ./db/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WMPSES_MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wmpses-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WMPSES_DB_BACKEND: mysql
      WMPSES_MYSQL_HOST: mysql
      WMPSES_MYSQL_PORT: 3306
      WMPSES_MYSQL_DATABASE: ${WMPSES_MYSQL_DATABASE:-wmpses}
      WMPSES_MYSQL_USER: ${WMPSES_MYSQL_USER:-wmpses}
      WMPSES_MYSQL_PASSWORD: ${WMPSES_MYSQL_PASSWORD:-wmpses123456}
      WMPSES_MYSQL_POOL_SIZE: ${WMPSES_MYSQL_POOL_SIZE:-24}
      WMPSES_WORKERS: ${WMPSES_WORKERS:-4}
      WMPSES_AUTH_SECRET: ${WMPSES_AUTH_SECRET:-wmpses-prod-change-this-secret-2026}
      WMPSES_TOKEN_TTL: ${WMPSES_TOKEN_TTL:-43200}

  nginx:
    image: nginx:1.27-alpine
    container_name: wmpses-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WMPSES_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro

volumes:
  wmpses_mysql_data:
