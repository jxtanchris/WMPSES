<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全景图为什么能拖动？—— 取景窗口演示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a1018; color: #dbe6f2;
               font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  .panel { position: absolute; background: rgba(9, 16, 26, 0.82); border: 1px solid rgba(96, 165, 250, 0.28);
           border-radius: 12px; backdrop-filter: blur(6px); }
  #hint { left: 18px; top: 18px; max-width: 470px; padding: 14px 18px; line-height: 1.75; font-size: 13.5px; }
  #hint b { color: #7dd3fc; }
  #hint .k { color: #fbbf24; font-weight: 600; }
  #hint code { background: rgba(125, 211, 252, .12); padding: 1px 5px; border-radius: 4px; color: #7dd3fc; }
  #hud { left: 18px; bottom: 18px; padding: 10px 14px; font-size: 12.5px; color: #9fb3c8; font-variant-numeric: tabular-nums; }
  #hud span { color: #e8f1fb; }
  #mapWrap { right: 18px; bottom: 18px; padding: 10px; }
  #mapWrap .cap { font-size: 12px; color: #9fb3c8; margin: 0 0 6px 2px; }
  #map { display: block; border-radius: 6px; }
  #tools { right: 18px; top: 18px; padding: 10px 12px; display: flex; gap: 8px; flex-direction: column; }
  #tools button { background: rgba(37, 99, 235, .18); border: 1px solid rgba(96, 165, 250, .45);
                  color: #cfe4ff; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  #tools button:hover { background: rgba(37, 99, 235, .35); }
  #tools label { font-size: 12px; color: #9fb3c8; display: flex; align-items: center; gap: 8px; }
  #tools input[type=range] { width: 120px; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hint">
  <div style="font-size:15px;font-weight:700;color:#eaf4ff;margin-bottom:6px;">你拖动的不是图片，而是「取景窗口」</div>
  这张 JPG 把 <b>360° 横向 × 180° 纵向</b> 的每个方向都存成了一个像素，
  相当于把球面剪开摊平（就像世界地图和地球仪的关系）。<br>
  拖动时程序做的事只有三步：<br>
  ① 算出相机朝向 <code>方位角 θ</code>、<code>俯仰角 φ</code>；<br>
  ② 换算成图上的位置 <code>u = 0.5 + θ/360°</code>、<code>v = 0.5 - φ/180°</code>；<br>
  ③ 以 (u,v) 为中心，按视野角裁一块矩形贴到屏幕上。<br>
  <span class="k">图片本身从头到尾没动过</span>，右下角小地图里那个框就是"你正在看的这一块"。
</div>

<div class="panel" id="tools">
  <button id="btnMap">隐藏取景框</button>
  <button id="btnReset">回到默认视角</button>
  <label>视野 <input id="fov" type="range" min="35" max="110" value="80" step="1"></label>
</div>

<div class="panel" id="hud">
  方位角 <span id="hyaw">0°</span>　俯仰角 <span id="hpitch">0°</span>　
  u <span id="hu">50%</span>　视野 <span id="hfov">80°</span>
</div>

<div class="panel" id="mapWrap">
  <div class="cap">整张全景图（2:1）· 蓝框 = 当前取景窗口</div>
  <canvas id="map" width="340" height="170"></canvas>
</div>

<script>
(function () {
  const view = document.getElementById('view');
  const ctx = view.getContext('2d');
  const map = document.getElementById('map');
  const mctx = map.getContext('2d');
  const img = new Image();
  img.src = '3D全景底图A_白天装置区.jpg';

  const state = { yaw: 0.22, pitch: -0.30, fovDeg: 80, showMap: true, dpr: 1 };
  const DEFAULT = { yaw: 0.22, pitch: -0.30, fovDeg: 80 };

  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.width = Math.round(innerWidth * state.dpr);
    view.height = Math.round(innerHeight * state.dpr);
    draw();
  }

  // 与 scene-3d.js 的 drawBackgroundAndFloor 同样的取图逻辑
  function draw() {
    if (!img.complete || !img.naturalWidth) return;
    const W = view.width, H = view.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;

    // 焦距：由水平视野角反推，等价于垂直方向裁一块矩形
    const fovX = state.fovDeg * Math.PI / 180;
    const focal = (W / 2) / Math.tan(fovX / 2);
    const fovY = 2 * Math.atan((H / 2) / focal);

    let u = (state.yaw / (2 * Math.PI) + 0.5) % 1; if (u < 0) u += 1;
    const v = Math.min(0.95, Math.max(0.05, 0.5 - state.pitch / Math.PI));

    const sw = fovX / (2 * Math.PI) * iw;
    const sh = fovY / Math.PI * ih;
    let sx = u * iw - sw / 2;
    let sy = Math.min(Math.max(v * ih - sh / 2, 0), ih - sh);

    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    const w = W / state.dpr, h = H / state.dpr;

    const nx = ((sx % iw) + iw) % iw;
    if (nx + sw <= iw) {
      ctx.drawImage(img, nx, sy, sw, sh, 0, 0, w, h);
    } else {
      const w1 = iw - nx;
      const dw1 = w1 / sw * w;
      ctx.drawImage(img, nx, sy, w1, sh, 0, 0, dw1, h);
      ctx.drawImage(img, 0, sy, sw - w1, sh, dw1, 0, w - dw1, h);
    }

    // 中心十字（提示"正前方"）
    ctx.strokeStyle = 'rgba(125,211,252,.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w / 2 - 9, h / 2); ctx.lineTo(w / 2 + 9, h / 2);
    ctx.moveTo(w / 2, h / 2 - 9); ctx.lineTo(w / 2, h / 2 + 9);
    ctx.stroke();

    // HUD
    let yawDeg = (state.yaw * 180 / Math.PI) % 360; if (yawDeg < 0) yawDeg += 360;
    document.getElementById('hyaw').textContent = yawDeg.toFixed(0) + '°';
    document.getElementById('hpitch').textContent = (state.pitch * 180 / Math.PI).toFixed(0) + '°';
    document.getElementById('hu').textContent = (u * 100).toFixed(0) + '%';
    document.getElementById('hfov').textContent = state.fovDeg + '°';

    drawMap(u, v, fovX, fovY);
  }

  function drawMap(u, v, fovX, fovY) {
    if (!state.showMap) return;
    const mw = map.width, mh = map.height;
    mctx.clearRect(0, 0, mw, mh);
    if (!img.complete) return;
    mctx.drawImage(img, 0, 0, mw, mh);
    const rw = fovX / (2 * Math.PI) * mw;
    const rh = fovY / Math.PI * mh;
    let rx = u * mw - rw / 2;
    const ry = v * mh - rh / 2;
    mctx.strokeStyle = '#38bdf8';
    mctx.lineWidth = 2;
    mctx.strokeRect(rx, ry, rw, rh);
    if (rx < 0) mctx.strokeRect(rx + mw, ry, rw, rh);
    if (rx + rw > mw) mctx.strokeRect(rx - mw, ry, rw, rh);
  }

  // ---------- 交互 ----------
  let dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true; view.classList.add('dragging');
    lastX = e.clientX; lastY = e.clientY;
    view.setPointerCapture && view.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    state.yaw -= dx * 0.005;
    state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch + dy * 0.0035));
    draw();
  }
  function up() { dragging = false; view.classList.remove('dragging'); }

  view.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  view.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.fovDeg = Math.max(35, Math.min(110, state.fovDeg + Math.sign(e.deltaY) * 4));
    document.getElementById('fov').value = state.fovDeg;
    draw();
  }, { passive: false });

  document.getElementById('fov').addEventListener('input', (e) => {
    state.fovDeg = +e.target.value; draw();
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    Object.assign(state, DEFAULT);
    document.getElementById('fov').value = state.fovDeg;
    draw();
  });
  document.getElementById('btnMap').addEventListener('click', (e) => {
    state.showMap = !state.showMap;
    document.getElementById('mapWrap').style.display = state.showMap ? '' : 'none';
    e.target.textContent = state.showMap ? '隐藏取景框' : '显示取景框';
    if (state.showMap) draw();
  });

  window.addEventListener('resize', resize);
  img.addEventListener('load', () => { resize(); });
  resize();
})();
</script>
</body>
</html>
